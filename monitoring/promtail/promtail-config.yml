server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'

  # Signal Backend Service logs
  - job_name: signal-backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: signal-backend
          service: backend
          __path__: /var/log/signal/backend/*.log

  # Signal WebSocket Service logs
  - job_name: signal-websocket
    static_configs:
      - targets:
          - localhost
        labels:
          job: signal-websocket
          service: websocket
          __path__: /var/log/signal/websocket/*.log

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/{messages,secure,maillog,cron}

  # Journal logs
  - job_name: journal
    journal:
      max_age: 12h
      labels:
        job: systemd-journal
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: 'unit'
      - source_labels: ['__journal__boot_id']
        target_label: 'boot_id'
      - source_labels: ['__journal__transport']
        target_label: 'transport'

pipeline_stages:
  # Parse JSON logs
  - json:
      expressions:
        timestamp: timestamp
        level: level
        message: message
        service: service
        request_id: request_id
        user_id: user_id

  # Extract timestamp
  - timestamp:
      source: timestamp
      format: RFC3339Nano

  # Add labels
  - labels:
      level:
      service:
      request_id:

  # Output stage
  - output:
      source: message