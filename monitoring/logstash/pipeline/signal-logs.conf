# Logstash pipeline configuration for Signal application logs

input {
  # Docker container logs
  beats {
    port => 5044
  }
  
  # Syslog input for system logs
  syslog {
    port => 514
    type => "syslog"
  }
  
  # TCP input for application logs
  tcp {
    port => 5000
    type => "tcp"
    codec => json_lines
  }
  
  # UDP input for high-volume logs
  udp {
    port => 5000
    type => "udp"
    codec => json_lines
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
    type => "webhook"
  }
  
  # File input for log files
  file {
    path => ["/var/log/signal/*.log"]
    start_position => "beginning"
    type => "signal-file"
    codec => "json"
  }
}

filter {
  # Parse container logs
  if [container] {
    if [container][name] =~ /^signal-/ {
      mutate {
        add_field => { "service" => "%{[container][name]}" }
        add_field => { "environment" => "production" }
      }
      
      # Remove container prefix from service name
      mutate {
        gsub => [ "service", "signal-", "" ]
      }
    }
  }
  
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed_json"
    }
    
    if [parsed_json] {
      # Extract common fields from JSON
      if [parsed_json][timestamp] {
        date {
          match => [ "[parsed_json][timestamp]", "ISO8601" ]
        }
      }
      
      if [parsed_json][level] {
        mutate {
          add_field => { "log_level" => "%{[parsed_json][level]}" }
        }
      }
      
      if [parsed_json][service] {
        mutate {
          add_field => { "service" => "%{[parsed_json][service]}" }
        }
      }
      
      if [parsed_json][request_id] {
        mutate {
          add_field => { "request_id" => "%{[parsed_json][request_id]}" }
        }
      }
      
      if [parsed_json][user_id] {
        mutate {
          add_field => { "user_id" => "%{[parsed_json][user_id]}" }
        }
      }
    }
  }
  
  # Parse Go application logs
  if [service] == "backend" or [service] == "websocket" {
    # Parse Go standard log format
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:log_level}\] %{GREEDYDATA:log_message}"
      }
      tag_on_failure => ["_grokparsefailure_go"]
    }
    
    # Parse HTTP access logs
    if "access" in [tags] {
      grok {
        match => { 
          "message" => "%{COMBINEDAPACHELOG}"
        }
        tag_on_failure => ["_grokparsefailure_access"]
      }
    }
  }
  
  # Parse WebSocket logs
  if [service] == "websocket" {
    if "websocket" in [message] {
      grok {
        match => { 
          "message" => "WebSocket %{WORD:ws_action}: %{WORD:room_id} user:%{WORD:user_id} %{GREEDYDATA:ws_details}"
        }
        tag_on_failure => ["_grokparsefailure_websocket"]
      }
    }
  }
  
  # Parse database logs
  if [service] == "postgres" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{NUMBER:process_id}\] %{WORD:log_level}:  %{GREEDYDATA:db_message}"
      }
      tag_on_failure => ["_grokparsefailure_postgres"]
    }
    
    # Parse slow query logs
    if "slow query" in [db_message] {
      grok {
        match => { 
          "db_message" => "slow query: duration: %{NUMBER:query_duration:float}s.*statement: %{GREEDYDATA:sql_query}"
        }
        tag_on_failure => ["_grokparsefailure_slow_query"]
      }
      
      if [query_duration] {
        if [query_duration] > 1.0 {
          mutate {
            add_tag => ["slow_query", "performance_issue"]
          }
        }
      }
    }
  }
  
  # Parse Redis logs
  if [service] == "redis" {
    grok {
      match => { 
        "message" => "%{REDISTIMESTAMP:timestamp} %{WORD:redis_role} %{GREEDYDATA:redis_message}"
      }
      tag_on_failure => ["_grokparsefailure_redis"]
    }
  }
  
  # Geolocation enrichment for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # User-Agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Security log analysis
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" {
    mutate {
      add_tag => ["error"]
    }
    
    # Detect potential security issues
    if "unauthorized" in [message] or "forbidden" in [message] or "authentication failed" in [message] {
      mutate {
        add_tag => ["security", "auth_failure"]
      }
    }
    
    if "rate limit" in [message] or "too many requests" in [message] {
      mutate {
        add_tag => ["security", "rate_limit"]
      }
    }
    
    if "sql injection" in [message] or "xss" in [message] {
      mutate {
        add_tag => ["security", "attack"]
      }
    }
  }
  
  # Performance monitoring
  if [response_time] {
    if [response_time] > 1000 {
      mutate {
        add_tag => ["performance", "slow_response"]
      }
    }
  }
  
  # Business logic monitoring
  if "signal created" in [message] {
    mutate {
      add_tag => ["business", "signal_creation"]
    }
  }
  
  if "user joined signal" in [message] {
    mutate {
      add_tag => ["business", "signal_join"]
    }
  }
  
  if "chat message sent" in [message] {
    mutate {
      add_tag => ["business", "chat_activity"]
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => ["beat", "prospector", "offset", "parsed_json"]
  }
  
  # Add processing timestamp
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "signal-logs-%{+YYYY.MM.dd}"
    template_name => "signal-logs"
    template => "/usr/share/logstash/templates/signal-logs-template.json"
    template_overwrite => true
    
    # Document type routing
    if [service] {
      document_type => "%{service}"
    } else {
      document_type => "general"
    }
  }
  
  # Separate index for errors
  if "error" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "signal-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Separate index for security events
  if "security" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "signal-security-%{+YYYY.MM.dd}"
    }
  }
  
  # Performance monitoring index
  if "performance" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "signal-performance-%{+YYYY.MM.dd}"
    }
  }
  
  # Business metrics index
  if "business" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "signal-business-%{+YYYY.MM.dd}"
    }
  }
  
  # Debug output (can be disabled in production)
  if [log_level] == "DEBUG" {
    stdout {
      codec => rubydebug
    }
  }
  
  # Dead letter queue for failed documents
  if "_indexfail" in [tags] {
    file {
      path => "/var/log/logstash/failed_docs.log"
      codec => json_lines
    }
  }
}