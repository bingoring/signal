version: '3.8'

services:
  # 테스트용 PostgreSQL with PostGIS
  test-postgres:
    image: postgis/postgis:13-3.1
    container_name: signal-test-postgres
    environment:
      POSTGRES_DB: signal_test
      POSTGRES_USER: signal_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - signal-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal_test -d signal_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 테스트용 Redis
  test-redis:
    image: redis:6-alpine
    container_name: signal-test-redis
    ports:
      - "6380:6379"
    networks:
      - signal-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 테스트용 MinIO (S3 호환 스토리지)
  test-minio:
    image: minio/minio:latest
    container_name: signal-test-minio
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      MINIO_ACCESS_KEY: test_access_key
      MINIO_SECRET_KEY: test_secret_key
    command: server /data --console-address ":9001"
    volumes:
      - test_minio_data:/data
    networks:
      - signal-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 테스트용 Backend 서비스
  test-backend:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: signal-test-backend
    environment:
      - ENV=test
      - DATABASE_URL=postgres://signal_test:test_password@test-postgres:5432/signal_test?sslmode=disable
      - REDIS_URL=redis://test-redis:6379
      - JWT_SECRET=test_jwt_secret_key_for_testing_only
      - S3_ENDPOINT=http://test-minio:9000
      - S3_ACCESS_KEY=test_access_key
      - S3_SECRET_KEY=test_secret_key
      - S3_BUCKET=signal-test-bucket
    ports:
      - "8081:8080"
    depends_on:
      test-postgres:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-minio:
        condition: service_healthy
    networks:
      - signal-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # 테스트용 WebSocket 서비스
  test-websocket:
    build:
      context: ./be
      dockerfile: Dockerfile.websocket
    container_name: signal-test-websocket
    environment:
      - ENV=test
      - REDIS_URL=redis://test-redis:6379
      - BACKEND_URL=http://test-backend:8080
    ports:
      - "8082:8081"
    depends_on:
      test-redis:
        condition: service_healthy
      test-backend:
        condition: service_healthy
    networks:
      - signal-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/ws/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 테스트 러너 컨테이너
  test-runner:
    image: golang:1.21-alpine
    container_name: signal-test-runner
    working_dir: /app
    volumes:
      - ./tests:/app/tests
      - ./be:/app/be
    environment:
      - TEST_DATABASE_URL=postgres://signal_test:test_password@test-postgres:5432/signal_test?sslmode=disable
      - TEST_REDIS_URL=redis://test-redis:6379
      - TEST_BACKEND_URL=http://test-backend:8080
      - TEST_WEBSOCKET_URL=ws://test-websocket:8081
    depends_on:
      test-backend:
        condition: service_healthy
      test-websocket:
        condition: service_healthy
    networks:
      - signal-test-network
    command: /bin/sh -c "sleep infinity"

volumes:
  test_postgres_data:
  test_minio_data:

networks:
  signal-test-network:
    driver: bridge